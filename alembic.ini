# Migraciones del esquema ortesislab. La URL no se guarda aquí: db/alembic/env.py
# la lee de ORTESISLAB_MIGRATOR_DATABASE_URL o, con `-x base=test`, de
# ORTESISLAB_TEST_MIGRATOR_DATABASE_URL (entorno o .env de la raíz).

[alembic]
script_location = %(here)s/db/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
